[package]
name = "env-indonesia-mcp"
version = "1.0.0"
edition = "2021"
description = "Environmental AI MCP Server for Indonesia — 224 tools covering all 20 domains of Environmental Engineering"

[dependencies]
# MCP SDK
rmcp = { version = "2.0", features = ["server", "transport-io"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# GIS (Pure Rust)
geo = "0.29"
geojson = "0.24"

# Utilities
chrono = "0.4"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
schemars = "1.2.1"
