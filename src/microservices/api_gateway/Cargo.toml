[package]
name = "api_gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1.36.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tonic = "0.10.2"
prost = "0.12.6"

[build-dependencies]
tonic-build = "0.10.2"
